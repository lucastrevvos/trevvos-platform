name: Backend .NET 10 validation

on:
  pull_request:
    paths:
      - 'src/backend/**'
      - 'tests/**'
      - 'Trevvos.sln'
      - 'global.json'
      - '.github/workflows/backend-dotnet10.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Trevvos.sln
      - name: Build
        run: dotnet build Trevvos.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Trevvos.sln --no-build --configuration Release
