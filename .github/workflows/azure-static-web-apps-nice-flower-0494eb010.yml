name: Deploy Trevvos Web

on:
  push:
    branches:
      - main
    paths:
      - "src/frontend/trevvos-web/**"
      - ".github/workflows/azure-static-web-apps-nice-flower-0494eb010.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "src/frontend/trevvos-web/**"
      - ".github/workflows/azure-static-web-apps-nice-flower-0494eb010.yml"
  workflow_dispatch:

concurrency:
  group: trevvos-web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy Trevvos Web (Next.js)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build and deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_FLOWER_0494EB010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/frontend/trevvos-web"
          api_location: ""
          output_location: "out"
          app_build_command: "npm run build"
        env:
          IS_STATIC_EXPORT: "true"
          NEXT_PUBLIC_FORMSPREE_CONTACT_ID: "xyzebnjv"
          NEXT_PUBLIC_FORMSPREE_COMMERCE_ID: "xyzebnjv"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Trevvos Web preview
    steps:
      - name: Close pull request preview
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_FLOWER_0494EB010 }}
          action: "close"
