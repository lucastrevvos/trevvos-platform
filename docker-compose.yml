services:
  postgres:
    image: postgres:17-alpine
    container_name: trevvos-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trevvos_dev}
      POSTGRES_USER: ${POSTGRES_USER:-trevvos_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trevvos_dev_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - trevvos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  trevvos_postgres_data:
