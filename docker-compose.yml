services:
  postgres:
    image: postgres:16-alpine
    container_name: trevvos-postgres
    environment:
      POSTGRES_DB: trevvos
      POSTGRES_USER: trevvos
      POSTGRES_PASSWORD: trevvos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - trevvos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trevvos -d trevvos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trevvos-postgres-data:
